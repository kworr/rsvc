[package]
name = "rsvc"
version = "0.1.0"
edition = "2024"

[dependencies]
async-signal = "0.2.14"
clap = { version = "4.6.7", features = ["derive"] }
event-listener = "5.4.2"
libc = "0.2.190"
smol = "2.0.2"
stacked_errors = "0.8.0"

[lib]
name = "rsvc"
path = "src/lib.rs"

[[bin]]
name = "rsvc"
path = "src/main.rs"
